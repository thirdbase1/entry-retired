[package]
name = "entry-desktop"
version = "0.1.0"
description = "Native desktop shell and future agent harness for Entry"
authors = ["thirdbase1"]
edition = "2021"

[lib]
name = "entry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
